pairs:
- question: I have scaly patchy raised lesions over b/l elbow and b/l knee joints with dryness and itching.
    What is my ailment? What is the solution?
  answer: 'The symptoms you''ve described, such as scaly patchy raised lesions over b/l elbow and b/l
    knee joint with dryness and itching, can be analyzed through the lens of Ayurveda to predict a potential
    problem or disease. Ayurveda identifies imbalances in the Vata, Pitta, and Kapha doshas as key factors
    in various health issues. Vata Dosha: Scaly lesions: This is often associated with aggravated Vata
    dosha. When Vata dosha is imbalanced, it can lead to scaly patchy raised lesions. When Pitta is aggravated,
    it can cause raised lesions, redness of lesions. Kapha Dosha: Itching: it is the classic kapha dosha
    symptom i.e. Pratyatma lakshana of kapha. Based on these symptoms and their association with dosha
    imbalances, your condition could be related to an Eka kusta or psoriasis, which predominantly involves
    imbalances of mainly Vata and Kapha doshas in association with pitta dosha.'
- question: Is it Eka kusta only because of Vata dosha and Kapha Dosha.
  answer: 'No in ayurveda it is mentioned any disease mentioned in Ayurveda it involves all the three
    doshas but based on the percentage of involvement it has been mentioned the involvement of dosha.
    It means Eka kusta have all the three dosha but based on majority it have vata and kapha dosha. Eka
    kusta or psoriasis: It is a non- infectious chronic relapsing inflammatory skin disease characterized
    by scaly erythematous patches. The eruptions is usually symmetrical and most commonly affects extensor
    surfaces of elbow, knee, scalp, nails.'
- question: Which are the doshas involved and which system is involved in Eka kusta.
  answer: The prominent Dosha involved in Eka kusta is Vata and Kapha dosha in association with pitta
    dosha also. The system or the srothas involved in Eka kusta is Rasavaha and raktavaha srothas.
- question: What is solution for the disease Eka kusta in Ayurveda
  answer: Principles of Ayurveda line of treatment involves Shodhana therapy mainly called as panchakarma
    treatment and shamana line of treatment or palliative of maintenance treatment and diet regime including
    do's and don'ts.
- question: Can you elaborate the panchakarma and palliative treatment involved in Eka kusta.
  answer: 'The important panchakarma done in most of the Eka kusta patients are virechana (purgative)
    treatment with various medications. The palliative or the shamana treatment is done before panchakarma
    as preprocedure or to prepare patient for panchakarma. Those are Amapachana: langhana (fasting), deepana
    (stimulation of Agni i.e. digestive fire) as internal medication and Swedana (dry and hot application)
    as external application. Snehanapana: as it carried out to facilitate the mobilization of doshas from
    site of manifestation to the site of elimination i.e. kosta. And it also helps to loosen dosha and
    dushya bonding. Ex: Maha tiktaka grhita. This ghrita has tikta rasa, madhura vipaka, ushna virya dravya.
    And has properties like rakta shodaka, kandugna, kustagna. Virechana with trivith lehya: as it does
    sukha virechana and removes vyadhi from mula. The do''s and don''ts include 1. Intake of light and
    small quantity of food. 2. Avoid junk foods and which are heavy to digest. 3. Intake of hot water
    only. 4. Avoid day sleep and sound sleep in night. 5. Avoid curd in food. 6. Have balanced diet and
    nutritious food 7. Have daily mild exercise.'
