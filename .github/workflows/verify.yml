name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install (CPU-only checks; the CUDA wheels are not needed)
        run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check src finetune tests scripts
      - name: Dataset integrity + API tests (no model weights)
        run: uv run --frozen --with pyyaml pytest -q tests/test_metrics.py tests/test_api.py tests/test_prompting.py
      - run: uv run --frozen python scripts/validate_xcodeproj.py --project "AcharyaGPT(iOS)/AcharyaGPT(iOS).xcodeproj/project.pbxproj"
