# Deterministic safety routing for the chat API (runs before and after the model).
# urgent / self_harm / dose questions get a fixed reply without calling the model.
responses:
  urgent: "This sounds like a medical emergency. Please call your local emergency number (for example 112 in India or 911 in the US) or go to the nearest emergency department right away. Do not rely on Ayurvedic or home remedies for these symptoms."
  self_harm: "I'm really sorry you're feeling this way, and you don't have to go through it alone. Please contact a crisis line right now - for example Tele-MANAS on 14416 in India or 988 in the US - or call your local emergency number, and reach out to someone you trust."
  dose: "I can't recommend doses or a personal treatment plan. The right amount depends on your age, health, the preparation used and any other medicines you take, so please consult a qualified Ayurvedic practitioner or doctor. I can share general educational information about a herb or condition if that helps."
query_patterns:
  urgent:
  - "\\b(?:cannot|can't|cant|unable to|can not) breathe\\b"
  - "\\b(?:trouble|difficulty|struggling) breathing\\b"
  - "\\b(?:blue|bluish) lips?\\b|\\blips? (?:are|is) (?:turning )?(?:blue|bluish)\\b"
  - "\\b(?:severe|crushing|sudden) chest pain\\b|\\bchest pain (?:spreading|radiating)\\b"
  - "\\b(?:unconscious|unresponsive|seizure|convulsion|fitting|heavy bleeding|bleeding heavily)\\b"
  - "\\b(?:overdose|swallowed (?:poison|bleach|pills)|rat poison|snake ?bite|bitten by a snake)\\b"
  - "\\b(?:having a|had a|is having a) (?:stroke|heart attack)\\b|\\bface (?:suddenly )?droop"
  self_harm:
  - "\\b(?:kill|hurt|harm) (?:myself|me)\\b"
  - "\\b(?:want|plan|planning|thinking|going) to (?:end|kill|hurt|harm) (?:myself|my life|it all)\\b"
  - "\\b(?:suicidal|suicide|end my life|don't want to live|do not want to live)\\b"
  dose:
  - "\\b(?:what|which|how much|how many|exact|right|correct|safe|daily|personali[sz]ed) (?:\\w+ ){0,3}(?:dose|dosage|doses)\\b"
  - "\\bhow (?:much|many) (?:\\w+ ){0,4}(?:should|can|do|must) (?:i|we|he|she|my \\w+) (?:take|give|consume|have|eat|drink)\\b"
  - "\\b(?:how many|what quantity of) (?:grams|mg|milligrams|ml|tablets|capsules|tsp|teaspoons|spoons)\\b"
  - "\\b(?:dosage|dosing) (?:chart|schedule|plan)\\b"
# Output guard: a generated answer that contains a dose is replaced by the dose reply.
dose_in_answer: "\\b\\d+(?:\\.\\d+)?\\s*(?:-\\s*\\d+(?:\\.\\d+)?\\s*)?(?:mg|mcg|g|gm|grams?|ml|tsp|teaspoons?|tbsp|tablespoons?|capsules?|tablets?)\\b(?:\\s*(?:per day|a day|daily|twice|thrice|once|times))?"
