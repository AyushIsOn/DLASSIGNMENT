version: 3
mode: bm25_only
tokenizer: unicode_word_v1
bm25:
  k1: 1.5
  b: 0.75
  top_k: 5
  candidate_k: 20
hybrid:
  dense_candidate_k: 20
  rrf_k: 60
  maximum_contexts: 6
support:
  minimum_informative_terms: 2
  single_term_query_minimum: 1
  calibration_version: 2
  dense_grid: [0.40, 0.50, 0.60, 0.70, 0.80]
  rerank_grid: [0.40, 0.50, 0.60, 0.70, 0.80]
  claim_threshold_grid:
    minimum: 0.50
    maximum: 0.99
    step: 0.01
  claim_calibration_version: 1
generation:
  mode: extractive
  context_window_tokens: 32768
  output_tokens: 768
  maximum_prompt_bytes: 131072
  deadline_seconds: 30
  maximum_attempts: 2
extractive:
  max_sentences: 2
  max_characters: 700
