# AcharyaGPT fine-tuning configuration (one H200 141 GB; also fits an 80 GB A100/H100).
base_model:
  repository: Qwen/Qwen3-8B            # Apache-2.0, post-trained chat model (thinking disabled)
  revision: b968826d9c46dd6066d109eabc6255188de91218
  local_dir: artifacts/models/Qwen3-8B
  # sha256 of every weight shard, verified on CPU before any GPU time is spent
  shards:
    model-00001-of-00005.safetensors: 31d6a825ae35f11fb85b195b4c42c146c051e446433125a215336abdf95cbf5f
    model-00002-of-00005.safetensors: 5991236cea6fe21f3d43cab0f0e84448734fbbe0789816202989f2ddc9d18282
    model-00003-of-00005.safetensors: c5185c4794be2d8a9784d5753c9922db38df478ce11f9ed0b415b7304d896836
    model-00004-of-00005.safetensors: b5ee7de71fbf17db3d5704e0c8f2bc7d005ca9e1d7ca2aeb19827b0cfcaa917a
    model-00005-of-00005.safetensors: 20c2d6366ab85c90786ccdd829cd2b9e7d30ef3b2ebbb998280e7e4014b542ff

data_dir: data/sft
output_dir: artifacts/run
max_seq_len: 1024                       # longest example is 812 tokens; nothing is truncated

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 3                             # ~3,200 optimizer steps; ~16M tokens in total
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  micro_batch_size: 16
  gradient_accumulation: 2              # effective batch = 32 sequences
  gradient_checkpointing: true          # keeps peak memory ~50 GB even for the longest batch
  eval_every_steps: 200
  logging_steps: 10
  keep_checkpoints: 2
  max_train_minutes: 210                # hard stop (checkpoint + best adapter kept) if ever reached
  seed: 3407

evaluation:
  batch_size: 64
  max_new_tokens: 256
  loss_batch_size: 16
