# AcharyaGPT round 2: Qwen3-14B LoRA on one H200 (141 GB). Also fits an 80 GB H100/A100
# (the memory probe then turns on gradient checkpointing or halves the batch by itself).
# Fallback for less GPU time / a smaller Mac: ACHARYA_CONFIG=configs/train_8b.yaml
base_model:
  repository: Qwen/Qwen3-14B           # Apache-2.0; same tokenizer + chat template as Qwen3-8B
  revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
  local_dir: artifacts/models/Qwen3-14B
  # sha256 of every weight shard (from the Hub), verified on CPU before any GPU time is spent
  shards:
    model-00001-of-00008.safetensors: e942bdbdf08857d16a8fef7d1dae9fceabeb4e84def6043485fe2f6f085dab0e
    model-00002-of-00008.safetensors: f7c9c6eee628f5ad831d2d1d292e120505e5fcadeb38f88b4d3c4cb86306ccf9
    model-00003-of-00008.safetensors: dfb8c5df9404b41ad6ae74e8b6b367135f017b4467b884cf71b17c71954f18a9
    model-00004-of-00008.safetensors: eab286fec759e3e59ab228621aefa0fef14ed56039e06f959e67257d5af7604d
    model-00005-of-00008.safetensors: 97f0dc2992e59da95c466eff6f4fd0c8335843bbc36ed5c913a6f5150748c0e6
    model-00006-of-00008.safetensors: 9e8e76a013cd5e253865b792991e0b410f869b136b3c500079b531b09198e99e
    model-00007-of-00008.safetensors: 0aee70ee6e91dc00d818804fb47f124d13ee4ad5b4a64553e09dbf9391cd5750
    model-00008-of-00008.safetensors: 0d6b92296e326d39bbbaeb32c3ec454ac606da843d4c8ffa8edf010b62b8c9e0

data_dir: data/sft
output_dir: artifacts/run2                # round 1 stays untouched in artifacts/run
max_seq_len: 1536                       # longest example is 1,316 tokens; nothing is truncated

lora:
  r: 64
  alpha: 128
  dropout: 0.0                          # no dropout: saves an activation copy per layer
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 2                             # 88k rows x 2 = ~29M tokens; round 1's 3 epochs memorised
  learning_rate: 1.5e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_tokens_per_batch: 16384           # per optimizer step; the probe may split it in 2 micro-batches
  gradient_accumulation: 1              # ~16k tokens per optimizer step, ~900 steps per epoch
  gradient_checkpointing: auto          # off unless the memory probe on the worst batch needs it
  max_memory_fraction: 0.88             # probe peak (+ optimizer state) must stay below this
  dataloader_workers: 4
  eval_every_steps: 200                 # validation loss + best-model checkpoint (~1 min each)
  eval_batch_size: 32
  save_every_minutes: 10                # extra time-based resume points between evaluations
  logging_steps: 10
  keep_checkpoints: 2                   # + the best one, which Trainer never deletes
  max_train_minutes: 115                # hard stop that still leaves time for evaluation
  seed: 3407

evaluation:
  batch_size: 96
  max_new_tokens: 256
  loss_batch_size: 32
