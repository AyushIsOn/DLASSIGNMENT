<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0f">
<title>AcharyaGPT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 -apple-system, system-ui, Roboto, sans-serif;
         background: #0d0f0f; color: #ebebeb; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; display: flex; align-items: center; gap: 10px;
           border-bottom: 1px solid #ffffff1f; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header button { background: none; border: 0; color: #ebebeb; font-size: 20px; padding: 4px 8px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .intro { text-align: center; color: #aaa; margin: 24px 8px; }
  .intro b { color: #ebebeb; font-size: 20px; display: block; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chip { border: 1px solid #ffffff55; border-radius: 16px; padding: 6px 12px; background: #ffffff10;
          color: #ebebeb; font-size: 14px; }
  .msg { border: 1px solid #ffffff4d; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
         background: linear-gradient(135deg, #ffffff14, #ffffff2e); white-space: pre-wrap; }
  .who { font-size: 12px; font-weight: 700; color: #aaa; margin-bottom: 4px; }
  .meta { margin-top: 8px; font-size: 12px; color: #9aa; }
  .badge { display: inline-block; border-radius: 8px; padding: 1px 7px; margin-right: 6px;
           background: #0f766e55; color: #5eead4; font-weight: 700; }
  .badge.safety { background: #dc262655; color: #fca5a5; }
  details { margin-top: 6px; font-size: 13px; color: #bbb; }
  .err { color: #f87171; font-size: 14px; padding: 0 16px 8px; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         border-top: 1px solid #ffffff1f; background: #151818; }
  textarea { flex: 1; resize: none; border-radius: 14px; border: 1px solid #ffffff66;
             background: #00000066; color: #ebebeb; padding: 12px; font: inherit; max-height: 120px; }
  form button { border-radius: 14px; border: 1px solid #ffffff66; background: #ffffff1f;
                color: #ebebeb; padding: 0 16px; font-size: 16px; }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<header><h1>AcharyaGPT</h1><button id="new" title="New chat">&#9998;</button></header>
<div id="log">
  <div class="intro" id="intro"><b>Namaste, I am AcharyaGPT</b>
    An educational assistant for Ayurveda - not medical advice.
    <div class="chips">
      <button class="chip">What is Amlapitta?</button>
      <button class="chip">Which dosha is predominant in Ardita?</button>
      <button class="chip">What are the three doshas?</button>
      <button class="chip">What does vatavyadhih mean?</button>
    </div>
  </div>
</div>
<div class="err" id="err"></div>
<form id="f"><textarea id="q" rows="1" placeholder="What's your query?" enterkeyhint="send"></textarea>
  <button id="send">Send</button></form>
<script>
const log = document.getElementById("log"), q = document.getElementById("q"),
      send = document.getElementById("send"), err = document.getElementById("err");
let history = [];
const labels = {finetuned_rag: "Fine-tuned + RAG", finetuned: "Fine-tuned", safety: "Safety"};
function add(who, text, res) {
  document.getElementById("intro")?.remove();
  const div = document.createElement("div"); div.className = "msg";
  div.innerHTML = `<div class="who">${who}</div>`;
  div.appendChild(document.createTextNode(text));
  if (res) {
    const meta = document.createElement("div"); meta.className = "meta";
    const badge = document.createElement("span");
    badge.className = "badge" + (res.mode === "safety" ? " safety" : "");
    badge.textContent = labels[res.mode] || res.mode; meta.appendChild(badge);
    if (res.latency_ms && res.mode !== "safety") meta.append((res.latency_ms / 1000).toFixed(1) + " s");
    div.appendChild(meta);
    for (const c of res.citations || []) {
      const d = document.createElement("details"); const s = document.createElement("summary");
      s.textContent = c.source; d.appendChild(s); d.append(c.text); div.appendChild(d);
    }
  }
  log.appendChild(div); log.scrollTop = log.scrollHeight; return div;
}
async function ask(text) {
  text = text.trim(); if (!text || send.disabled) return;
  q.value = ""; q.blur(); err.textContent = ""; send.disabled = true;
  add("You", text); const wait = add("AcharyaGPT", "thinking...");
  try {
    const r = await fetch("v1/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({message: text, history: history.slice(-4)})});
    const body = await r.json();
    wait.remove();
    if (!r.ok) throw new Error(body?.error?.message || ("HTTP " + r.status));
    add("AcharyaGPT", body.answer, body);
    history.push({role: "user", content: text}, {role: "assistant", content: body.answer});
  } catch (e) { wait.remove(); err.textContent = "Error: " + e.message; q.value = text; }
  finally { send.disabled = false; }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
log.addEventListener("click", e => { if (e.target.classList.contains("chip")) ask(e.target.textContent); else q.blur(); });
document.getElementById("new").onclick = () => location.reload();
</script>
</body>
</html>
