[project]
name = "acharyagpt"
version = "0.1.0"
description = "Offline-first, cited Ayurvedic knowledge retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "kaggle==2.2.4",
  "pandas==2.3.0",
  "pyarrow==20.0.0",
  "pydantic==2.11.5",
  "pypdf==5.6.0",
  "pyyaml==6.0.2",
  "uvicorn==0.34.3",
  "zstandard==0.23.0",
]

[project.scripts]
acharya = "acharya.cli:main"

[project.optional-dependencies]
retrieval = [
  "sentence-transformers==4.1.0",
]
training = [
  "accelerate==1.7.0",
  "datasets==3.6.0",
  "peft==0.15.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.16.0",
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "ruff==0.11.13",
  "types-pyyaml==6.0.12.20250516",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acharya", "training"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
  "external_network: requires external network access",
  "gpu: requires a CUDA GPU",
  "macos: requires macOS and Xcode",
  "network_blocked: runs with external networking denied",
  "integration: integration test",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["acharya"]

[[tool.mypy.overrides]]
module = [
  "huggingface_hub",
  "huggingface_hub.*",
  "kaggle",
  "kaggle.*",
  "pyarrow",
  "pyarrow.*",
  "pypdf.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "datasets",
  "datasets.*",
  "peft",
  "peft.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["training.train_qlora"]
disallow_subclassing_any = false
