[project]
name = "acharyagpt"
version = "1.0.0"
description = "AcharyaGPT: Qwen3-8B LoRA fine-tuned on Ayurveda knowledge, served to an iOS app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Core = the chat backend only (enough to serve through Ollama on a Mac).
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.5",
  "pyyaml==6.0.2",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
# Only needed to rebuild data/sft from the original Kaggle/PDF sources.
data = [
  "kagglehub==1.0.2",
]
# GPU training, evaluation, report charts, merging and local transformers serving.
train = [
  "accelerate==1.7.0",
  "datasets==3.6.0",
  "matplotlib==3.10.3",
  "peft==0.15.2",
  "torch==2.14.1",
  "transformers==4.57.6",
]

[project.scripts]
acharya = "acharya.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.0",
  "ruff==0.11.13",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

# CUDA 12.6 build of torch: runs on every NVIDIA driver >= 525, unlike the
# default CUDA 13 wheel which needs driver >= 580. Linux only; macOS uses PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acharya", "finetune"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
  "slow: CPU training/generation smoke tests (tens of seconds)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_ref"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # "word list".split() is clearer than a long list literal
